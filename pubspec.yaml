name: sphere_datasheets
description: >
  ABA Data Collection App with FileMaker Integration.
  A modern Flutter application for recording, tracking, and syncing ABA session data through FileMaker.

publish_to: 'none'

version: 1.0.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # HTTP requests
  http: ^1.1.0
  dio: ^5.3.2
  
  # JSON handling
  json_annotation: ^4.8.1
  
  # Date/time handling
  intl: ^0.20.2
  
  # Local storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  flutter_secure_storage: ^9.0.0
  
  # Environment variables
  flutter_dotenv: ^5.1.0
  
  # Connectivity monitoring
  connectivity_plus: ^5.0.2
  
  # Image picker for camera
  image_picker: ^1.0.7
  
  # File export
  excel: ^4.0.4
  pdf: ^3.10.7
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  
  # UI components
  cupertino_icons: ^1.0.6
  
  # FileMaker specific - using standard HTTP package

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^5.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  
  # Testing dependencies
  mockito: ^5.4.2
  # integration_test:
  #   sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
